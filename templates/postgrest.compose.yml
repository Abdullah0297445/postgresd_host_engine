services:
  postgrest:
    image: postgrest/postgrest:v14.16
    restart: unless-stopped
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: ${PGRST_ANON_ROLE}

      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}

      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost

      PGRST_OPENAPI_SERVER_PROXY_URI: https://api.example.com
    healthcheck:
      test: ["CMD", "/bin/postgrest", "--ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    memswap_limit: 256m
    networks:
      - default
      - postgres_host_network
      - traefik_host_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postgrest-public.rule=Host(`api.example.com`)"
      - "traefik.http.routers.postgrest-public.entrypoints=web"
      - "traefik.http.routers.postgrest-public.middlewares=force-secure@docker"
      - "traefik.http.routers.postgrest-secure.rule=Host(`api.example.com`)"
      - "traefik.http.routers.postgrest-secure.entrypoints=websecure"
      - "traefik.http.routers.postgrest-secure.tls.certresolver=${RESOLVER_NAME}"
      - "traefik.http.services.postgrest.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_host_network"

networks:
  postgres_host_network:
    external: true
  traefik_host_network:
    external: true
