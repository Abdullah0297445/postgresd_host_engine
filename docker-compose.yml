services:
  # ---------------------------------------------------------------------------
  # The engine itself.
  #
  # Settings travel as `command:` flags, never as a mounted postgresql.conf. The
  # image writes its own conf into the volume at first start, so a mounted file
  # has to replace it whole and can then drift from the image. Flags cannot
  # half-apply, they survive the volume, and they sit beside the mem_limit they
  # must agree with.
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: engine-postgres
    restart: always
    environment:
      # The one engine superuser. It provisions tenants and runs the backup.
      # No tenant ever gets this password.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by initdb/01-engine-auth.sh, which runs on an empty volume only.
      PGBOUNCER_AUTH_USER: ${PGBOUNCER_AUTH_USER}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD}
    command:
      - postgres
      # 25% of this container's mem_limit. Context is postmaster, so a change
      # here needs a restart, which takes every tenant down at once.
      - "-c"
      - "shared_buffers=1GB"
      # Must cover both doors' server connections plus everything that bypasses
      # them — pgadmin, the backup, and any PostgREST — with headroom on top.
      - "-c"
      - "max_connections=120"
      # One global law. A session that needs more raises it itself with
      # `SET work_mem`. Never `ALTER ROLE ... SET work_mem`, which would put a
      # tenant's name inside the engine's configuration.
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      # Set on its own. Left at -1 it follows maintenance_work_mem, so the value
      # above would be taken again by every autovacuum worker.
      - "-c"
      - "autovacuum_work_mem=64MB"
      - "-c"
      - "effective_cache_size=3GB"
      # One query then takes at most 3 processes. There is no `cpus` limit
      # anywhere; parallelism is capped here instead.
      - "-c"
      - "max_parallel_workers=4"
      # The only warning that a query needs more than the 4MB work_mem law.
      - "-c"
      - "log_temp_files=0"
      # Shows whether the cleaners keep up.
      - "-c"
      - "log_autovacuum_min_duration=0"
    volumes:
      # Postgres 18 sets PGDATA=/var/lib/postgresql/18/docker and declares the
      # volume one level up. Mount the parent, not .../data.
      - engine_data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 4g
    memswap_limit: 4g
    # Postgres 18 fails a parallel hash join on docker's default 64MB /dev/shm.
    # This is a cap, not a reservation, so it costs nothing until a parallel
    # query uses it.
    shm_size: 256m
    networks:
      - default
      - postgres_host_network

  # ---------------------------------------------------------------------------
  # The transaction door. The default door for a tenant that keeps no state on
  # the connection between transactions.
  # ---------------------------------------------------------------------------
  pgbouncer-transaction:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: engine-pgbouncer-transaction
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Names no database, so the [databases] section becomes the catch-all
      # `* = host=postgres port=5432 auth_user=...`. The entrypoint also writes
      # ONE userlist.txt line, for this lookup role alone — pgbouncer takes the
      # auth_user's own password from that file. No tenant password is ever in
      # it, and adding a tenant never touches pgbouncer.
      DATABASE_URL: postgres://${PGBOUNCER_AUTH_USER}:${PGBOUNCER_AUTH_PASSWORD}@postgres:5432/
      AUTH_TYPE: scram-sha-256
      AUTH_USER: ${PGBOUNCER_AUTH_USER}
      # $$1 reaches pgbouncer as $1. The function is SECURITY DEFINER, so the
      # lookup role needs no rights on pg_authid itself.
      AUTH_QUERY: SELECT * FROM public.pgbouncer_get_auth($$1)
      # Pinned to the postgres database, so the function is installed once
      # rather than into every tenant database.
      AUTH_DBNAME: postgres
      POOL_MODE: transaction
      LISTEN_PORT: 5432
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 15
      MAX_DB_CONNECTIONS: 30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    memswap_limit: 128m
    networks:
      default:
      postgres_host_network:
        aliases:
          # An alias, not a service name, so a door can be moved, renamed or
          # removed later without a tenant editing its .env.
          - engine

  # ---------------------------------------------------------------------------
  # The session door. For a tenant that keeps state on the connection, such as a
  # schema selection.
  #
  # A tenant on this door MUST keep CONN_MAX_AGE = 0. Session pooling holds one
  # engine connection for as long as the tenant holds its own, so a long-lived
  # client connection pins a server connection and the pool exhausts.
  # ---------------------------------------------------------------------------
  pgbouncer-session:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: engine-pgbouncer-session
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${PGBOUNCER_AUTH_USER}:${PGBOUNCER_AUTH_PASSWORD}@postgres:5432/
      AUTH_TYPE: scram-sha-256
      AUTH_USER: ${PGBOUNCER_AUTH_USER}
      AUTH_QUERY: SELECT * FROM public.pgbouncer_get_auth($$1)
      AUTH_DBNAME: postgres
      POOL_MODE: session
      LISTEN_PORT: 5432
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      MAX_DB_CONNECTIONS: 30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    memswap_limit: 128m
    networks:
      default:
      postgres_host_network:
        aliases:
          - engine-session

  # ---------------------------------------------------------------------------
  # pgadmin. The only part of the engine the internet can reach, so it stands
  # behind two locks: a traefik basicauth middleware, and its own login.
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: engine-pgadmin
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      # PGADMIN_REPLACE_SERVERS_ON_STARTUP is deliberately absent. Set to
      # "True" it runs `setup.py load-servers --replace` on every start, and
      # --replace deletes every server row for the user before re-importing.
      # A password saved in the browser is a column on that row, so it is
      # deleted with it, at every redeploy. servers.json holds no password to
      # put back — the loader reads Name, Host, Port and Username, and there
      # is no Password key.
      # The cost is that servers.json now seeds an empty volume only. Change
      # the server here and nothing happens to a live pgadmin: change it in
      # the browser too, or delete the pgadmin_data volume to re-seed.
      # The default is 80, which a uid-5050 process should not have to bind.
      # It must match loadbalancer.server.port below.
      PGADMIN_LISTEN_PORT: 5050
      # The entrypoint reads ONLY the PGADMIN_CONFIG_ prefix. A bare
      # PROXY_X_PROTO_COUNT does nothing. PROTO defaults to 0, and that is
      # exactly what makes pgadmin build http:// redirects behind TLS
      # termination, so the login loops.
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: 1
      # pgadmin sits at the root of its own subdomain, not under a path.
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: 0
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "True"
      # A forgotten password then resets with `setup.py reset-password` inside
      # the container, and not by email.
      PGADMIN_DISABLE_POSTFIX: 1
      GUNICORN_ACCESS_LOGFILE: /dev/null
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # /pgadmin4/servers.json is already the default path, so
      # PGADMIN_SERVER_JSON_FILE is not needed.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    healthcheck:
      # Runs inside the container, so the traefik basicauth does not affect it.
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://localhost:5050/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    memswap_limit: 512m
    labels:
      - "traefik.enable=true"
      # The hash comes from PGADMIN_BASIC_AUTH in .env, where every `$` must be
      # doubled or the value is truncated — see .env.example for why. Never
      # write a hash literally here.
      - "traefik.http.middlewares.pgadmin-auth.basicauth.users=${PGADMIN_BASIC_AUTH}"
      - "traefik.http.middlewares.pgadmin-auth.basicauth.removeheader=true"
      - "traefik.http.routers.pgadmin-public.rule=Host(`${PGADMIN_HOST}`)"
      - "traefik.http.routers.pgadmin-public.entrypoints=web"
      - "traefik.http.routers.pgadmin-public.middlewares=force-secure@docker"
      - "traefik.http.routers.pgadmin-secure.rule=Host(`${PGADMIN_HOST}`)"
      - "traefik.http.routers.pgadmin-secure.entrypoints=websecure"
      # On the -secure router only. The -public router only redirects to HTTPS,
      # so auth there would prompt over plain HTTP for nothing.
      - "traefik.http.routers.pgadmin-secure.middlewares=pgadmin-auth@docker"
      - "traefik.http.routers.pgadmin-secure.tls.certresolver=${RESOLVER_NAME}"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=5050"
      - "traefik.docker.network=traefik_host_network"
    networks:
      - default
      - traefik_host_network

  # ---------------------------------------------------------------------------
  # The backup. This repo owns the script; the image supplies the S3 client, the
  # scheduler and pg_dump 18.4 that the engine image lacks. The script is
  # mounted over the image's own /backup.sh, so no image is built here.
  # ---------------------------------------------------------------------------
  backup:
    image: siemens/postgres-backup-s3:18
    container_name: engine-backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Read by the image's run.sh, which execs `go-cron "$SCHEDULE" sh backup.sh`.
      SCHEDULE: ${BACKUP_SCHEDULE}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Databases the script must skip, comma separated. It never names a
      # database to INCLUDE — it reads pg_database instead.
      BACKUP_EXCLUDE_DATABASES: ${BACKUP_EXCLUDE_DATABASES}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      # Lose this and every archive is waste.
      PASSPHRASE: ${BACKUP_PASSPHRASE}
    volumes:
      # A SINGLE-FILE bind mount pins the inode, so an edit to this script does
      # NOT reach a running container. After changing it, run:
      #   docker compose up -d --force-recreate backup
      - ./scripts/backup.sh:/backup.sh:ro
    healthcheck:
      # This container is a scheduler. Healthy means the scheduler is alive; it
      # says nothing about whether the last run succeeded, which is only in the
      # logs.
      test: ["CMD-SHELL", "pgrep -f go-cron > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    memswap_limit: 256m
    networks:
      # default only. It reaches Postgres directly and never through a door —
      # pg_dump through a transaction pooler fails.
      - default

volumes:
  engine_data:
  # Needs no backup. Losing it costs one server definition and a saved
  # password, both re-entered in a minute, and pgadmin rebuilds its admin
  # account from .env on an empty volume. It is not empty of secrets, though:
  # a password saved in the browser lives here, encrypted under the pgadmin
  # login, so treat it as it deserves.
  pgadmin_data:

networks:
  # Hand-created: `docker network create postgres_host_network`
  postgres_host_network:
    name: postgres_host_network
    external: true
  # Created by the host's reverse proxy stack, not by this one.
  traefik_host_network:
    name: traefik_host_network
    external: true
